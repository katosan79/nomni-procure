<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Nomni HQ</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <style>
    body { background: var(--surface-soft); }

    .login-page {
      display: flex;
      min-height: 100vh;
    }

    /* ── Nav rail (login-only: ghost/decorative) ── */
    .login-chrome {
      width: var(--nav-width, 220px);
      flex-shrink: 0;
      background: var(--chrome-bg);
      display: flex;
      flex-direction: column;
      padding: var(--space-xl) var(--space-lg);
      gap: var(--space-3xl);
    }
    .login-wordmark {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }
    .login-wordmark-icon {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .login-wordmark-icon svg { width: 16px; height: 16px; fill: var(--seaweed); }
    .login-wordmark-text {
      font-size: 16px; font-weight: 600;
      color: var(--chrome-fg);
      letter-spacing: -0.01em;
    }
    .login-nav {
      display: flex; flex-direction: column;
      gap: var(--space-xs);
    }
    .login-nav-item {
      display: flex; align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 500;
      color: var(--chrome-fg-soft);
      opacity: 0.4;
      user-select: none;
    }
    .login-nav-item i { font-size: 16px; flex-shrink: 0; }

    /* ── Main area ── */
    .login-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3xl) var(--space-2xl);
    }

    /* ── Card ── */
    .login-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-3xl);
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: var(--space-2xl);
    }

    .status-banner {
      display: flex; align-items: center;
      gap: var(--space-sm);
      background: var(--status-ok-bg);
      border-radius: var(--radius-sm);
      padding: var(--space-sm) var(--space-md);
      font-size: 12px; font-weight: 500;
      color: var(--status-ok-fg);
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--status-ok-fg);
      flex-shrink: 0;
    }

    .card-header { display: flex; flex-direction: column; gap: var(--space-sm); }
    .card-eyebrow {
      font-size: 11px; font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-accent);
    }
    .card-title {
      font-size: 24px; font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .card-sub {
      font-size: 14px;
      color: var(--text-soft);
      line-height: 1.5;
      margin-top: 2px;
    }

    .form { display: flex; flex-direction: column; gap: var(--space-lg); }
    .field { display: flex; flex-direction: column; gap: var(--space-xs); }
    .field label { font-size: 13px; font-weight: 500; color: var(--text); }
    .field input {
      font-family: 'Hanken Grotesk', system-ui, sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px var(--space-md);
      height: var(--control-h);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input::placeholder { color: rgba(14,55,39,0.35); }
    .field input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(18,155,65,0.12);
    }
    .field-row {
      display: flex; align-items: center;
      justify-content: space-between;
    }
    .field-row label { font-size: 13px; font-weight: 500; color: var(--text); }
    .forgot {
      font-size: 12px; font-weight: 500;
      color: var(--text-link);
      text-decoration: none;
      cursor: pointer;
    }
    .forgot:hover { text-decoration: underline; }

    .btn-primary {
      font-family: 'Hanken Grotesk', system-ui, sans-serif;
      font-size: 14px; font-weight: 600;
      background: var(--btn-primary-bg);
      color: var(--btn-primary-fg);
      border: none;
      border-radius: var(--radius-md);
      height: var(--control-h);
      cursor: pointer;
      transition: background 0.15s;
      width: 100%;
      letter-spacing: -0.01em;
    }
    .btn-primary:hover { background: var(--btn-primary-hover); }
    .btn-primary:active { transform: scale(0.99); }

    .divider {
      display: flex; align-items: center;
      gap: var(--space-md);
    }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-label { font-size: 12px; color: var(--text-soft); }

    .btn-sso {
      font-family: 'Hanken Grotesk', system-ui, sans-serif;
      font-size: 13px; font-weight: 500;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      height: var(--control-h);
      cursor: pointer;
      width: 100%;
      display: flex; align-items: center; justify-content: center;
      gap: var(--space-sm);
      transition: border-color 0.15s, background 0.15s;
      letter-spacing: -0.01em;
    }
    .btn-sso:hover {
      border-color: rgba(14,55,39,0.3);
      background: var(--surface-soft);
    }
    .btn-sso i { font-size: 16px; color: var(--text-soft); }

    .card-footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-soft);
      line-height: 1.6;
    }
    .card-footer a {
      color: var(--text-link);
      text-decoration: none;
      font-weight: 500;
    }
    .card-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h2 class="sr-only">Nomni HQ — sign in to your account</h2>

  <div class="login-page">
    <aside class="login-chrome" aria-hidden="true">
      <div class="login-wordmark">
        <div class="login-wordmark-icon">
          <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 3h4v4H3zM9 3h4v4H9zM3 9h4v4H3zM9 9h4v4H9z" opacity="0.9"/>
          </svg>
        </div>
        <span class="login-wordmark-text">nomni</span>
      </div>
      <nav class="login-nav">
        <div class="login-nav-item"><i class="ti ti-layout-dashboard"></i>Overview</div>
        <div class="login-nav-item"><i class="ti ti-receipt"></i>Market lists</div>
        <div class="login-nav-item"><i class="ti ti-tools-kitchen-2"></i>Recipes</div>
        <div class="login-nav-item"><i class="ti ti-package"></i>Inventory</div>
        <div class="login-nav-item"><i class="ti ti-device-desktop"></i>POS mapping</div>
        <div class="login-nav-item"><i class="ti ti-chart-bar"></i>Reporting</div>
      </nav>
    </aside>

    <main class="login-main">
      <div class="login-card" role="main">

        <div class="status-banner" role="status" aria-live="polite">
          <div class="status-dot" aria-hidden="true"></div>
          All systems operational
        </div>

        <header class="card-header">
          <p class="card-eyebrow">HQ module</p>
          <h1 class="card-title">Sign in to your account</h1>
          <p class="card-sub">Central management for your outlet network.</p>
        </header>

        <form class="form" novalidate onsubmit="handleLogin(event)">
          <div class="field">
            <label for="email">Email address</label>
            <input
              type="email" id="email" name="email"
              placeholder="you@yourgroup.com.au"
              autocomplete="email" spellcheck="false"
            />
          </div>
          <div class="field">
            <div class="field-row">
              <label for="password">Password</label>
              <a class="forgot" tabindex="0" role="button">Forgot password?</a>
            </div>
            <input
              type="password" id="password" name="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
          </div>
          <button type="submit" class="btn-primary">Sign in</button>
        </form>

        <div class="divider" aria-hidden="true">
          <div class="divider-line"></div>
          <span class="divider-label">or</span>
          <div class="divider-line"></div>
        </div>

        <button class="btn-sso" type="button" onclick="window.location.href='dashboard.html'">
          <i class="ti ti-building" aria-hidden="true"></i>
          Continue with SSO
        </button>

        <footer class="card-footer">
          Don't have an account?
          <a tabindex="0" role="button">Contact your administrator</a>
        </footer>

      </div>
    </main>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
