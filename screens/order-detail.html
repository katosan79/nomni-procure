<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Order detail — Nomni Procure</title>
  <link rel="stylesheet" href="../shared/tokens.css?v=3"/>
  <link rel="stylesheet" href="../shared/components.css?v=3"/>
  <style>
    body { background: var(--surface-soft); }
    .page-body { padding-block: var(--space-2xl) var(--space-5xl); }

    /* ── Breadcrumb ── */
    .breadcrumb { display:flex; align-items:center; gap:var(--space-xs); font-size:13px; color:var(--text-soft); margin-bottom:var(--space-xl); }
    .breadcrumb a { color:var(--text-link); text-decoration:none; }
    .breadcrumb a:hover { text-decoration:underline; }

    /* ── Page header ── */
    .order-head { display:flex; align-items:flex-start; justify-content:space-between; gap:var(--space-xl); flex-wrap:wrap; margin-bottom:var(--space-xl); }
    .page-eyebrow { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-accent); }
    .order-eyebrow { display:flex; align-items:center; gap:var(--space-sm); margin-bottom:var(--space-xs); }
    .order-id { font-size:35px; font-weight:700; color:var(--text); letter-spacing:-0.025em; line-height:1.1; }
    .order-meta-line { display:flex; align-items:center; gap:var(--space-md); flex-wrap:wrap; font-size:13px; color:var(--text-soft); margin-top:var(--space-sm); }
    .meta-sep { width:1px; height:12px; background:var(--border); }
    .head-actions { display:flex; gap:var(--space-sm); align-items:center; flex-shrink:0; padding-top:4px; }

    /* ── Lifecycle timeline ── */
    .lifecycle { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:var(--space-lg) var(--space-xl) var(--space-md); margin-bottom:var(--space-lg); }
    .lc-row { display:flex; align-items:flex-start; }
    .lc-step { display:flex; flex-direction:column; align-items:center; gap:4px; flex:1; position:relative; }
    .lc-connector { flex:1; display:flex; flex-direction:column; align-items:stretch; padding-top:14px; }
    .lc-line { height:2px; background:var(--border); border-radius:1px; }
    .lc-line.done { background:var(--status-ok-fg); }
    .lc-dot { width:28px; height:28px; border-radius:var(--radius-pill); border:2px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--text-soft); flex-shrink:0; }
    .lc-label { font-size:11px; font-weight:600; color:var(--text-soft); text-align:center; white-space:nowrap; }
    .lc-date  { font-size:10px; color:var(--text-soft); text-align:center; white-space:nowrap; min-height:14px; }
    .lc-step.done .lc-dot  { background:var(--status-ok-bg); border-color:var(--status-ok-fg); color:var(--status-ok-fg); }
    .lc-step.done .lc-label { color:var(--text); }
    .lc-step.active .lc-dot { background:var(--btn-primary-bg); border-color:var(--btn-primary-bg); color:#fff; box-shadow:0 0 0 4px rgba(18,155,65,0.18); }
    .lc-step.active .lc-label { color:var(--text); font-weight:700; }
    .lc-step.risk .lc-dot  { background:var(--status-risk-bg); border-color:var(--status-risk-fg); color:var(--status-risk-fg); box-shadow:0 0 0 4px rgba(238,75,135,0.15); }
    .lc-step.risk .lc-label { color:var(--status-risk-fg); font-weight:700; }

    /* ── Action banner ── */
    .action-banner { display:flex; align-items:center; gap:var(--space-lg); padding:var(--space-lg) var(--space-xl); border-radius:var(--radius-lg); border:1px solid var(--border); margin-bottom:var(--space-lg); }
    .action-banner.approval { background:var(--status-warn-bg); border-color:rgba(245,194,25,0.5); }
    .action-banner.info     { background:var(--status-info-bg); border-color:rgba(63,195,251,0.35); }
    .action-banner.risk     { background:var(--status-risk-bg); border-color:rgba(238,75,135,0.35); }
    .action-banner.ok       { background:var(--status-ok-bg);   border-color:rgba(42,200,100,0.35); }
    .banner-icon { width:42px; height:42px; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0; }
    .banner-icon.approval { background:rgba(245,194,25,0.22); color:#7A5000; }
    .banner-icon.info     { background:rgba(63,195,251,0.22); color:var(--status-info-fg); }
    .banner-icon.risk     { background:rgba(238,75,135,0.22); color:var(--status-risk-fg); }
    .banner-icon.ok       { background:rgba(42,200,100,0.18); color:var(--status-ok-fg); }
    .banner-body { flex:1; min-width:0; }
    .banner-title { font-size:14px; font-weight:700; color:var(--text); }
    .banner-sub   { font-size:13px; color:var(--text-soft); margin-top:2px; line-height:1.4; }
    .banner-actions { display:flex; gap:var(--space-sm); flex-shrink:0; flex-wrap:wrap; }

    /* ── Tab nav ── */
    .detail-tabs { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:var(--space-lg); }
    .detail-tab { padding:var(--space-sm) var(--space-lg); background:none; border:none; border-bottom:2px solid transparent; font-family:inherit; font-size:13px; font-weight:600; color:var(--text-soft); cursor:pointer; margin-bottom:-1px; display:flex; align-items:center; gap:var(--space-xs); transition:color var(--dur-1) var(--ease-standard), border-color var(--dur-1) var(--ease-standard); white-space:nowrap; }
    .detail-tab:hover { color:var(--text); }
    .detail-tab.active { color:var(--text-accent); border-bottom-color:var(--text-accent); }
    .detail-tab .tab-badge-ok  { font-size:10px; font-weight:700; background:var(--status-ok-bg);   color:var(--status-ok-fg);   border-radius:var(--radius-pill); padding:1px 6px; }
    .detail-tab .tab-badge-inf { font-size:10px; font-weight:700; background:var(--status-info-bg); color:var(--status-info-fg); border-radius:var(--radius-pill); padding:1px 6px; }

    /* ── Two-column grid ── */
    .detail-grid { display:grid; grid-template-columns:1fr 308px; gap:var(--space-lg); align-items:start; }
    @media (max-width:960px) { .detail-grid { grid-template-columns:1fr; } }
    .detail-main { display:flex; flex-direction:column; gap:var(--space-lg); }
    .detail-aside { display:flex; flex-direction:column; gap:var(--space-lg); }

    /* ── Cards ── */
    .detail-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; }
    .detail-card.agent-surface { border-color:var(--agent-border); box-shadow:0 0 0 1px var(--agent-border), var(--shadow-sm); }
    .card-head { padding:var(--space-md) var(--space-xl); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:var(--space-md); }
    .card-head-title { font-size:14px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:var(--space-sm); }

    /* ── Line-items table ── */
    .items-tbl { width:100%; border-collapse:collapse; font-size:13px; }
    .items-tbl th { padding:var(--space-sm) var(--space-lg); text-align:left; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-soft); border-bottom:1px solid var(--border); background:var(--surface-soft); white-space:nowrap; }
    .items-tbl th.num, .items-tbl td.num { text-align:right; font-feature-settings:'tnum' 1; }
    .items-tbl td { padding:var(--space-md) var(--space-lg); border-bottom:1px solid var(--border); vertical-align:middle; }
    .items-tbl tr:last-child td { border-bottom:none; }
    .items-tbl tbody tr:hover td { background:var(--surface-soft); }
    .item-name { font-weight:600; color:var(--text); }
    .item-cat  { font-size:11px; color:var(--text-soft); margin-top:2px; }
    .item-sku  { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-soft); }
    .total-row td { background:var(--surface-soft); font-weight:700; font-size:14px; color:var(--text); font-feature-settings:'tnum' 1; padding:var(--space-md) var(--space-lg); border-top:1.5px solid var(--border); }
    .var-short { color:var(--status-risk-fg); font-weight:700; }
    .var-ok    { color:var(--status-ok-fg); font-weight:600; }

    /* ── GRN inputs ── */
    .grn-input { width:60px; height:30px; padding-inline:var(--space-sm); border:1px solid var(--border); border-radius:var(--radius-sm); font-family:inherit; font-size:13px; text-align:right; font-feature-settings:'tnum' 1; color:var(--text); background:var(--surface); }
    .grn-input:focus { outline:2px solid var(--text-accent); outline-offset:1px; }
    .grn-text  { width:100%; height:30px; padding-inline:var(--space-sm); border:1px solid var(--border); border-radius:var(--radius-sm); font-family:inherit; font-size:12px; color:var(--text); background:var(--surface); }
    .grn-text:focus { outline:2px solid var(--text-accent); outline-offset:1px; }
    .grn-checkbox { width:16px; height:16px; accent-color:var(--status-risk-fg); cursor:pointer; }
    .grn-photo-btn { width:32px; height:30px; border:1px dashed var(--border); border-radius:var(--radius-sm); background:var(--surface-soft); display:inline-flex; align-items:center; justify-content:center; font-size:14px; color:var(--text-soft); cursor:pointer; border-collapse:separate; }
    .grn-photo-btn:hover { border-color:var(--text-accent); color:var(--text-accent); }
    .grn-temp  { width:52px; }

    /* ── GRN summary bar ── */
    .grn-summary { display:flex; align-items:center; gap:var(--space-lg); padding:var(--space-md) var(--space-xl); background:var(--surface-soft); border-top:1px solid var(--border); font-size:13px; flex-wrap:wrap; }

    /* ── KV list ── */
    .kv-list { display:flex; flex-direction:column; }
    .kv-row  { display:flex; justify-content:space-between; align-items:flex-start; gap:var(--space-md); font-size:13px; padding:var(--space-sm) 0; border-bottom:1px solid var(--border); }
    .kv-row:last-child { border-bottom:none; }
    .kv-label { color:var(--text-soft); flex-shrink:0; }
    .kv-value { color:var(--text); font-weight:600; text-align:right; }

    /* ── Supplier card ── */
    .sup-avatar { width:44px; height:44px; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; flex-shrink:0; }

    /* ── Activity feed ── */
    .act-feed { display:flex; flex-direction:column; }
    .act-item { display:flex; gap:var(--space-md); padding:var(--space-md) var(--space-xl); position:relative; }
    .act-item:not(:last-child)::before { content:''; position:absolute; left:calc(var(--space-xl) + 10px); top:calc(var(--space-md) + 22px); bottom:0; width:1.5px; background:var(--border); }
    .act-dot { width:20px; height:20px; border-radius:var(--radius-pill); display:flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0; margin-top:2px; z-index:1; }
    .act-dot.ok      { background:var(--status-ok-bg);   color:var(--status-ok-fg); }
    .act-dot.info    { background:var(--status-info-bg); color:var(--status-info-fg); }
    .act-dot.warn    { background:var(--status-warn-bg); color:#7A5000; }
    .act-dot.risk    { background:var(--status-risk-bg); color:var(--status-risk-fg); }
    .act-dot.neutral { background:var(--surface-soft); color:var(--text-soft); border:1.5px solid var(--border); }
    .act-dot.agent   { background:var(--mint); color:var(--spinach); }
    .act-body { flex:1; min-width:0; }
    .act-text { font-size:13px; color:var(--text); line-height:1.4; }
    .act-time { font-size:11px; color:var(--text-soft); margin-top:2px; }

    /* ── Comms thread ── */
    .comms-msg { margin:var(--space-md) var(--space-xl); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; }
    .comms-msg-head { display:flex; align-items:flex-start; justify-content:space-between; gap:var(--space-md); padding:var(--space-sm) var(--space-md); border-bottom:1px solid var(--border); }
    .comms-msg-from { font-size:12px; font-weight:700; color:var(--text); }
    .comms-msg-time { font-size:11px; color:var(--text-soft); white-space:nowrap; }
    .comms-msg-body { padding:var(--space-md); font-size:12px; color:var(--text); line-height:1.6; white-space:pre-wrap; }
    .comms-attach { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; color:var(--text-link); padding:3px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); margin:0 var(--space-md) var(--space-md); cursor:pointer; }
    .comms-attach:hover { background:var(--surface-soft); }
    .comms-reply { margin:var(--space-md) var(--space-xl) var(--space-xl); display:flex; gap:var(--space-sm); }
    .comms-reply textarea { flex:1; padding:var(--space-sm) var(--space-md); border:1px solid var(--border); border-radius:var(--radius-md); font-family:inherit; font-size:13px; color:var(--text); resize:none; height:64px; background:var(--surface); }
    .comms-reply textarea:focus { outline:2px solid var(--text-accent); outline-offset:1px; }

    /* ── Agent byline ── */
    .agent-byline-sm { display:flex; align-items:center; gap:var(--space-sm); font-size:12px; color:var(--text-accent); }

    /* ── Modals ── */
    .modal-scrim { position:fixed; inset:0; background:rgba(14,55,39,0.45); z-index:200; display:flex; align-items:center; justify-content:center; padding:var(--space-xl); }
    .modal-box { background:var(--surface); border-radius:var(--radius-xl); padding:var(--space-2xl); width:100%; max-width:440px; box-shadow:var(--shadow-lg); display:flex; flex-direction:column; gap:var(--space-lg); }
    .modal-title { font-size:18px; font-weight:700; color:var(--text); }
    .modal-sub { font-size:13px; color:var(--text-soft); line-height:1.5; }
    .modal-foot { display:flex; justify-content:flex-end; gap:var(--space-sm); }
    .photo-drop { border:2px dashed var(--border); border-radius:var(--radius-lg); padding:var(--space-3xl) var(--space-2xl); text-align:center; color:var(--text-soft); font-size:13px; cursor:pointer; }
    .photo-drop:hover { border-color:var(--text-accent); color:var(--text-accent); }

    /* ── GRN notice bar ── */
    .grn-notice { display:flex; align-items:flex-start; gap:var(--space-sm); font-size:12px; color:var(--text-soft); line-height:1.5; padding:var(--space-md) var(--space-xl); background:var(--status-info-bg); border-bottom:1px solid rgba(63,195,251,0.25); }

    /* ── Inline link ── */
    .link-action { background:none; border:none; color:var(--text-link); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:0; }
    .link-action:hover { text-decoration:underline; }

    /* ── Invoice upload ── */
    .invoice-upload-zone { border:2px dashed var(--border); border-radius:var(--radius-lg); padding:var(--space-3xl) var(--space-2xl); text-align:center; color:var(--text-soft); font-size:13px; cursor:pointer; transition:border-color var(--dur-1) var(--ease-standard),color var(--dur-1) var(--ease-standard); }
    .invoice-upload-zone:hover { border-color:var(--text-accent); color:var(--text-accent); }
    .inv-thumb { display:flex; align-items:center; gap:var(--space-md); padding:var(--space-md) var(--space-xl); background:var(--surface-soft); border-bottom:1px solid var(--border); }
    .inv-thumb-img { width:52px; height:68px; border-radius:var(--radius-sm); background:var(--border); display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--text-soft); flex-shrink:0; border:1px solid var(--border); }
    /* ── Per-line photo badge ── */
    .photo-badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:2px 8px; border-radius:var(--radius-pill); background:var(--status-ok-bg); color:var(--status-ok-fg); white-space:nowrap; }
    /* ── Spinner ── */
    @keyframes ti-spin { to { transform:rotate(360deg); } }
    .ti-spin { display:inline-block; animation:ti-spin 0.9s linear infinite; }
    /* ── Summary alert banner ── */
    .attention-bar { display:flex; align-items:center; gap:var(--space-sm); flex-wrap:wrap; padding:var(--space-md) var(--space-xl); background:var(--status-warn-bg); border:1px solid rgba(245,194,25,0.5); border-radius:var(--radius-lg); margin-bottom:var(--space-lg); font-size:13px; }
  </style>
</head>
<body>
  <script src="../shared/shell.js?v=5" data-active="orders"></script>

  <div class="page-body">
    <div class="napp-canvas" data-measure="content">

      <nav class="breadcrumb">
        <a href="orders.html">Orders</a>
        <i class="ti ti-chevron-right"></i>
        <span id="bc-id" aria-current="page">—</span>
      </nav>

      <!-- ── Page header ── -->
      <div class="order-head">
        <div>
          <div class="order-eyebrow">
            <span class="page-eyebrow">Purchase order</span>
            <span id="status-pill"></span>
          </div>
          <h1 class="order-id" id="order-id">—</h1>
          <div class="order-meta-line">
            <span id="meta-supplier"></span><span class="meta-sep"></span>
            <span id="meta-outlet"></span><span class="meta-sep"></span>
            <span id="meta-value" style="font-feature-settings:'tnum' 1;font-weight:600;color:var(--text);"></span>
            <span class="meta-sep"></span>
            <span id="meta-expected"></span>
          </div>
        </div>
        <div class="head-actions" id="head-actions"></div>
      </div>

      <!-- ── Lifecycle ── -->
      <div class="lifecycle"><div class="lc-row" id="lc-row"></div></div>

      <!-- ── Action banner ── -->
      <div id="action-banner"></div>

      <!-- ── Tab nav ── -->
      <nav class="detail-tabs" id="detail-tabs"></nav>

      <!-- ── Two-column grid ── -->
      <div class="detail-grid">
        <div class="detail-main" id="detail-main"></div>
        <div class="detail-aside">
          <div class="detail-card">
            <div class="card-head"><span class="card-head-title"><i class="ti ti-info-circle"></i> Order info</span></div>
            <div style="padding:0 var(--space-xl) var(--space-sm);"><div class="kv-list" id="order-meta-kv"></div></div>
          </div>
          <div class="detail-card">
            <div class="card-head"><span class="card-head-title"><i class="ti ti-building-store"></i> Supplier</span></div>
            <div style="padding:var(--space-lg) var(--space-xl);" id="supplier-card-body"></div>
          </div>
          <div class="detail-card">
            <div class="card-head"><span class="card-head-title"><i class="ti ti-timeline"></i> Activity</span></div>
            <div class="act-feed" id="activity-feed"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Reject modal -->
  <div id="reject-modal" style="display:none;">
    <div class="modal-scrim" onclick="closeReject()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-title">Reject order</div>
        <div class="modal-sub">This PO will be returned to the requester with your reason. They can edit and resubmit.</div>
        <textarea style="width:100%;min-height:80px;padding:var(--space-md);border:1px solid var(--border);border-radius:var(--radius-md);font-family:inherit;font-size:13px;color:var(--text);resize:vertical;" placeholder="Reason for rejection (optional)…"></textarea>
        <div class="modal-foot">
          <button class="nb-btn" style="height:40px;padding-inline:var(--space-lg);border:1px solid var(--border);border-radius:var(--radius-md);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--text);" onclick="closeReject()">Cancel</button>
          <button style="height:40px;background:var(--status-risk-bg);color:var(--status-risk-fg);border:1px solid rgba(238,75,135,0.35);border-radius:var(--radius-md);padding-inline:var(--space-lg);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;" onclick="confirmReject()">Reject order</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Photo modal -->
  <div id="photo-modal" style="display:none;">
    <div class="modal-scrim" onclick="closePhoto()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <div class="modal-title">Attach photo</div>
        <div class="modal-sub" id="photo-modal-item">Item</div>
        <div class="photo-drop" onclick="photoUploaded()">
          <i class="ti ti-camera" style="font-size:32px;display:block;margin-bottom:var(--space-sm);"></i>
          Tap to take photo or choose from library
        </div>
        <div class="modal-foot">
          <button class="nb-btn" style="height:40px;padding-inline:var(--space-lg);border:1px solid var(--border);border-radius:var(--radius-md);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--text);" onclick="closePhoto()">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-wrap" style="position:fixed;bottom:var(--space-xl);left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => NomniShell.init('Order detail'));

    /* Suppliers connected via Nomni Supply — only these can push a "delivered" status */
    const NOMNI_SUPPLY = new Set(['Pacific Drinks Wholesale']);

    /* ── Reference data ── */
    const SUP_SCHEDULES = {
      'Harbour Meats':            'Mon / Wed / Fri · cutoff 3pm',
      'Fresh Produce Co':         'Mon – Fri · cutoff 2pm',
      'Green Farmers Market':     'Mon / Wed / Fri · cutoff 3pm',
      'Pacific Drinks Wholesale': 'Tue / Thu · cutoff 4pm',
      'Artisan Bakehouse':        'Mon – Sat · cutoff 8am',
      'Sydney Butchers Co.':      'Mon / Wed / Fri · cutoff noon',
    };
    const SUP_COLORS = {
      'Harbour Meats':            { bg:'rgba(23,179,163,0.14)', fg:'#0E7A6E' },

      'discrepancy':   { active:'Discrepancy',  done:['Created','Sent','Confirmed','Delivered'], risk:'Discrepancy', replace:'Received' },
    };

    function supInits(name) {
      return name.split(' ').filter(w=>w.length>2).map(w=>w[0]).slice(0,2).join('').toUpperCase() || name.slice(0,2).toUpperCase();
    }

    /* ── Render: lifecycle ── */
    function renderLifecycle(po) {
      const onNomniSupply = NOMNI_SUPPLY.has(po.supplier);
      const baseNodes = onNomniSupply ? LC_NODES_FULL : LC_NODES_SIMPLE;
      const lcs = LC_STATE[po.status] || LC_STATE['sent'];
      /* Strip 'Delivered' from done list for non-Nomni-Supply suppliers */
      const done = onNomniSupply ? (lcs.done||[]) : (lcs.done||[]).filter(d => d!=='Delivered');
      const nodes = baseNodes.map(n => (lcs.replace && n===lcs.replace) ? lcs.risk : n);
      let html = '';
      nodes.forEach((label, i) => {
        const isDone   = done.includes(label);
        const isRisk   = lcs.risk && label === lcs.risk;
        const isActive = label === (lcs.risk || lcs.active);
        const cls = isRisk ? 'risk' : isDone ? 'done' : isActive ? 'active' : '';
        const icon = isDone ? '<i class="ti ti-check"></i>'
                   : isRisk ? '<i class="ti ti-alert-triangle"></i>'
                   : isActive && po.status==='needs-manager' ? '<i class="ti ti-clock"></i>'
                   : (i+1);
        const dateStr = label==='Created'   ? po.created.split(',')[0]
                      : label==='Sent'      && po.sentAt      ? po.sentAt.split(',')[0]
                      : label==='Confirmed' && po.confirmedAt ? po.confirmedAt.split(',')[0]
                      : label==='Delivered' && po.deliveredAt ? po.deliveredAt.split(',')[0]
                      : label==='Received'  && po.receivedAt  ? po.receivedAt.split(',')[0]
                      : isActive && po.expected ? po.expected
                      : label==='Delayed' ? '<span style="color:var(--status-risk-fg)">'+po.expected+'</span>'
                      : '';
        html += `<div class="lc-step ${cls}"><div class="lc-dot">${icon}</div><div class="lc-label">${label}</div><div class="lc-date">${dateStr}</div></div>`;
        if (i < nodes.length-1) html += `<div class="lc-connector"><div class="lc-line${isDone?' done':''}"></div></div>`;
      });
      document.getElementById('lc-row').innerHTML = html;
    }

    /* ── Render: action banner ── */
    function renderActionBanner(po) {
      const wrap = document.getElementById('action-banner');
      const s = po.status;
      let html = '';
      if (s==='needs-manager') {
        html = `<div class="action-banner approval">
          <div class="banner-icon approval"><i class="ti ti-user-check"></i></div>
          <div class="banner-body">
            <div class="banner-title">Pending manager approval</div>
            <div class="banner-sub">Order value <strong>$${po.value.toLocaleString()}</strong> exceeds the $500 policy threshold.</div>
          </div>
          <div class="banner-actions role-editor-only">
            <button class="nb-btn primary" style="height:40px;" onclick="approveOrder()"><i class="ti ti-circle-check"></i> Approve</button>
            <button class="nb-btn" style="height:40px;background:var(--surface);border:1px solid var(--border);" onclick="openReject()"><i class="ti ti-x"></i> Reject</button>
          </div>
        </div>`;
      } else if (s==='sent'||s==='opened') {
        const note = s==='opened'
          ? `Supplier opened the PO email ${po.openedAt||''} — awaiting explicit confirmation`
          : 'Sent to supplier — no response yet';
        html = `<div class="action-banner info">
          <div class="banner-icon info"><i class="ti ti-clock"></i></div>
          <div class="banner-body"><div class="banner-title">Awaiting supplier confirmation</div><div class="banner-sub">${note} · Expected <strong>${po.expected}</strong></div></div>
          <div class="banner-actions">
            <button class="nb-btn" style="height:40px;background:var(--surface);border:1px solid var(--border);" id="chase-btn" onclick="sendChase()"><i class="ti ti-mail-forward"></i> Chase supplier</button>
          </div>
        </div>`;
      } else if (s==='confirmed') {
        html = `<div class="action-banner ok">
          <div class="banner-icon ok"><i class="ti ti-circle-check"></i></div>
          <div class="banner-body"><div class="banner-title">Confirmed — delivery on track</div><div class="banner-sub">Confirmed by <strong>${po.confirmedBy||'supplier'}</strong> via ${po.confirmedVia||'email'} · ${po.confirmedAt||''} · Expected <strong>${po.expected}</strong> · Submit GRN when goods arrive.</div></div>
          <div class="banner-actions">
            <button class="nb-btn primary" style="height:40px;" onclick="switchTab('grn')"><i class="ti ti-clipboard-check"></i> Submit GRN</button>
          </div>
        </div>`;
      } else if (s==='delivered') {
        html = `<div class="action-banner ok">
          <div class="banner-icon ok"><i class="ti ti-package"></i></div>
          <div class="banner-body"><div class="banner-title">Delivery confirmed via Nomni Supply — submit GRN to close order</div><div class="banner-sub">Delivery logged ${po.deliveredAt} by <strong>${po.supplier}</strong> · Confirm quantities, temperature, and condition per line.</div></div>
          <div class="banner-actions">
            <button class="nb-btn primary" style="height:40px;" onclick="switchTab('grn')"><i class="ti ti-clipboard-check"></i> Submit GRN</button>
          </div>
        </div>`;
      } else if (s==='delayed') {
        html = `<div class="action-banner risk">
          <div class="banner-icon risk"><i class="ti ti-alert-triangle"></i></div>
          <div class="banner-body"><div class="banner-title">Delivery ${po.daysOverdue||1} day${po.daysOverdue!==1?'s':''} overdue</div><div class="banner-sub">Expected <strong>${po.expected}</strong> · Chase for ETA or submit GRN if goods arrived.</div></div>
          <div class="banner-actions">
            <button class="nb-btn" style="height:40px;background:var(--surface);border:1px solid var(--border);" id="chase-btn" onclick="sendChase()"><i class="ti ti-mail-forward"></i> Chase supplier</button>
            <button class="nb-btn primary" style="height:40px;" onclick="switchTab('grn')"><i class="ti ti-clipboard-check"></i> Submit GRN</button>
          </div>
        </div>`;
      } else if (s==='discrepancy') {
        html = `<div class="action-banner risk">
          <div class="banner-icon risk"><i class="ti ti-alert-hexagon"></i></div>
          <div class="banner-body"><div class="banner-title">GRN submitted with discrepancy — ${po.discLines||2} lines short</div><div class="banner-sub">Invoice on hold. Raise a credit note or contact the supplier to arrange re-delivery.</div></div>
          <div class="banner-actions">
            <button class="nb-btn primary" style="height:40px;" onclick="toast('Raising credit note for ${po.id}…')"><i class="ti ti-receipt-refund"></i> Raise credit note</button>
            <button class="nb-btn" style="height:40px;background:var(--surface);border:1px solid var(--border);" onclick="switchTab('comms')"><i class="ti ti-message-circle"></i> View comms</button>
          </div>
        </div>`;
      } else if (s==='received') {
        html = `<div class="action-banner ok">
          <div class="banner-icon ok"><i class="ti ti-circle-check-filled"></i></div>
          <div class="banner-body"><div class="banner-title">Order complete</div><div class="banner-sub">GRN submitted ${po.receivedAt} by <strong>${po.grn?.receivedBy||'outlet staff'}</strong> · Invoice matched · No discrepancies.</div></div>
        </div>`;
      }
      wrap.innerHTML = html;
    }

    /* ── Render: tabs ── */
    let _tab = 'details';
    function buildTabList(po) {
      const s = po.status;
      const tabs = [{ id:'details', icon:'ti-list-details', label:'Details' }];
      if (s==='confirmed'||s==='delivered'||s==='delayed') tabs.push({ id:'grn', icon:'ti-clipboard-check', label:'Receive goods', badgeOk:'Action needed' });
      else if (s==='received'||s==='discrepancy') tabs.push({ id:'grn', icon:'ti-clipboard-check', label:'GRN' });
      tabs.push({ id:'comms', icon:'ti-messages', label:'Comms', badgeInf: po.comms?.length||0 });
      if (['confirmed','delivered','received','discrepancy'].includes(po.status)) tabs.push({ id:'invoice', icon:'ti-receipt', label:'Invoice', agent:true });
      return tabs;
    }
    function renderTabs(po) {
      document.getElementById('detail-tabs').innerHTML = buildTabList(po).map(t => {
        let badge = '';
        if (t.badgeOk) badge = `<span class="tab-badge-ok">${t.badgeOk}</span>`;
        if (t.badgeInf) badge = `<span class="tab-badge-inf">${t.badgeInf}</span>`;
        if (t.agent) badge = `<span style="font-size:10px;color:var(--text-accent);margin-left:2px;">✦</span>`;
        return `<button class="detail-tab${t.id===_tab?' active':''}" onclick="switchTab('${t.id}')"><i class="ti ${t.icon}"></i> ${t.label}${badge}</button>`;
      }).join('');
    }
    function switchTab(id) {
      _tab = id; renderTabs(_currentPO); renderMain(_currentPO);
    }

    /* ── Render: main panel ── */
    let _currentPO = null;
    function renderMain(po) {
      const el = document.getElementById('detail-main');
      el.innerHTML = '';
      if (_tab==='details')  renderDetails(po, el);
      else if (_tab==='grn')    renderGRN(po, el);
      else if (_tab==='comms')  renderComms(po, el);
      else if (_tab==='invoice') renderInvoice(po, el);
    }

    /* Details tab */
    function renderDetails(po, el) {
      const s = po.status;
      const showRecv = s==='received'||s==='discrepancy';
      let total = 0;
      const trows = po.items.map(item => {
        const lt = item.qty * item.unit; total += lt;
        let recvCols = '';
        if (showRecv) {
          const recv = item.recv !== undefined ? item.recv : item.qty;
          const diff = recv - item.qty;
          recvCols = `<td class="num">${recv}</td><td class="num">${diff===0 ? '<span class="var-ok"><i class="ti ti-check"></i></span>' : '<span class="var-short">−'+Math.abs(diff)+'</span>'}</td>`;
        }
        const isShort = showRecv && item.recv!==undefined && item.recv<item.qty;
        return `<tr${isShort?' style="background:rgba(238,75,135,0.04)"':''}>
          <td><div class="item-name">${item.supplierItem||item.name}</div><div class="item-cat">${item.supplierSku?'<span class="item-sku">'+item.supplierSku+'</span> · ':''}${item.supplierItem?item.name:item.cat}</div></td>
          <td class="num">${item.qty}</td><td style="color:var(--text-soft);font-size:13px;">${item.uom||'—'}</td><td class="num">$${item.unit.toFixed(2)}</td>
          ${recvCols}<td class="num">$${lt.toFixed(2)}</td></tr>`;
      }).join('');
      const cols = showRecv ? 5 : 3;
      const card = mkCard(`<i class="ti ti-list-details"></i> Line items`,
        `<span style="font-size:12px;color:var(--text-soft);">${po.items.length} item${po.items.length!==1?'s':''}</span>`,
        `<div style="overflow-x:auto;"><table class="items-tbl">
          <thead><tr><th>Item</th><th class="num">Qty</th><th>UoM</th><th class="num">Unit price</th>${showRecv?'<th class="num">Received</th><th class="num">Variance</th>':''}<th class="num">Total</th></tr></thead>
          <tbody>${trows}</tbody>
          <tfoot><tr class="total-row"><td colspan="${showRecv?4:3}" style="color:var(--text-soft);font-size:12px;text-transform:uppercase;letter-spacing:0.06em;">Order total</td>${showRecv?'<td class="num"></td><td class="num"></td>':''}<td class="num">$${total.toFixed(2)}</td></tr></tfoot>
        </table></div>`);
      el.appendChild(card);

      const delivRows = [
        kv('Expected delivery', s==='delayed'
          ? `<span style="color:var(--status-risk-fg);font-weight:700;">${po.expected} <span style="font-size:11px;font-weight:400;">(${po.daysOverdue||1}d overdue)</span></span>`
          : (po.expected||'—')),
        kv('Outlet', po.outletAddr||po.outlet),
        kv('Supplier schedule', SUP_SCHEDULES[po.supplier]||'—'),
        kv('Confirmation', po.confirmedBy ? `${po.confirmedBy} via ${po.confirmedVia}` : s==='sent'||s==='opened' ? 'Pending' : '—'),
        ...(po.grn ? [
          kv('Received by', po.grn.receivedBy),
          kv('Temp on arrival', po.grn.temp),
          kv('GRN note', `<em style="font-size:12px;">${po.grn.note}</em>`),
        ] : []),
      ].join('');
      el.appendChild(mkCard('<i class="ti ti-truck-delivery"></i> Delivery details', '', `<div style="padding:0 var(--space-xl) var(--space-sm);"><div class="kv-list">${delivRows}</div></div>`));
    }

    /* GRN tab */
    function renderGRN(po, el) {
      const isSubmitted = po.status==='received'||po.status==='discrepancy';
      let headBadge = isSubmitted
        ? `<span class="nb-pill ${po.status==='discrepancy'?'risk':'ok'}"><i class="ti ${po.status==='discrepancy'?'ti-alert-hexagon':'ti-circle-check-filled'}"></i>${po.status==='discrepancy'?'Discrepancy':'Submitted'}</span>`
        : `<span class="nb-pill info"><i class="ti ti-edit"></i> Enter quantities</span>`;
      let inner = '';
      if (!isSubmitted) {
        inner += `<div class="grn-notice"><i class="ti ti-info-circle" style="flex-shrink:0;margin-top:1px;"></i>Enter actual quantity received. Add batch/lot reference, temperature, damage flag, and photo per line if needed.</div>`;
      }
      // Table
      const trows = po.items.map((item, i) => {
        const recv = item.recv !== undefined ? item.recv : item.qty;
        if (isSubmitted) {
          const diff = recv - item.qty;
          const varStr = diff===0 ? '<span class="var-ok"><i class="ti ti-check"></i> Full</span>' : `<span class="var-short">−${Math.abs(diff)}</span>`;
          const isShort = recv < item.qty;
          return `<tr${isShort?' style="background:rgba(238,75,135,0.04)"':''}>
            <td><div class="item-name">${item.supplierItem||item.name}</div><div class="item-cat">${item.supplierSku?'<span class="item-sku">'+item.supplierSku+'</span> · ':''}${item.supplierItem?item.name:item.cat}</div></td>
            <td class="num">${item.qty}</td><td style="font-size:13px;color:var(--text-soft);">${item.uom||'—'}</td><td class="num">${varStr}</td>
            <td style="font-size:12px;color:var(--text-soft);">${item.batch||'—'}</td>
            <td class="num" style="font-size:12px;">${po.grn?.temp||'—'}</td>
            <td style="text-align:center;font-size:12px;">${item.dmg?'<span class="var-short"><i class="ti ti-flag"></i> Yes</span>':'—'}</td>
            <td style="text-align:center;">—</td></tr>`;
        }
        return `<tr id="grn-r-${i}">
          <td><div class="item-name">${item.supplierItem||item.name}</div><div class="item-cat">${item.supplierSku?'<span class="item-sku">'+item.supplierSku+'</span> · ':''}${item.supplierItem?item.name:item.cat}</div></td>
          <td class="num" style="color:var(--text-soft);">${item.qty}</td>
          <td style="font-size:13px;color:var(--text-soft);">${item.uom||'—'}</td>
          <td class="num"><input class="grn-input" id="grn-q-${i}" type="number" value="${item.qty}" min="0" oninput="grnCheck(${i},${item.qty})"/></td>
          <td><input class="grn-text" id="grn-l-${i}" type="text" placeholder="LOT-XXXXXX"/></td>
          <td class="num"><input class="grn-input grn-temp" id="grn-t-${i}" type="number" value="4" step="0.1"/></td>
          <td style="text-align:center;"><input class="grn-checkbox" id="grn-d-${i}" type="checkbox" onchange="grnCheck(${i},${item.qty})"/></td>
          <td style="text-align:center;"><button class="grn-photo-btn" id="grn-photo-${i}" onclick="openPhoto('${item.name.replace(/'/g,'\\u0027')}',${i})" title="Attach photo"><i class="ti ti-camera"></i></button></td></tr>`;
      }).join('');
      inner += `<div style="overflow-x:auto;"><table class="items-tbl">
        <thead><tr>
          <th>Item</th><th class="num">Ordered</th><th>UoM</th><th class="num">Received</th>
          <th>Batch / Lot</th><th class="num" style="white-space:nowrap;">Temp °C</th>
          <th style="text-align:center;">Damage</th><th style="text-align:center;">Photo</th>
        </tr></thead><tbody id="grn-tbody">${trows}</tbody></table></div>`;
      if (isSubmitted && po.grn?.note) {
        inner += `<div style="padding:var(--space-md) var(--space-xl);border-top:1px solid var(--border);font-size:13px;"><strong>Note:</strong> <span style="color:var(--text-soft);">${po.grn.note}</span></div>`;
      }
      if (!isSubmitted) {
        inner += `<div class="grn-summary">
          <span style="color:var(--text-soft);">Short:</span> <strong id="gs-short" style="color:var(--status-risk-fg);">0</strong>
          <span style="color:var(--text-soft);margin-left:var(--space-md);">Damaged:</span> <strong id="gs-dmg" style="color:var(--status-risk-fg);">0</strong>
          <div style="flex:1;"></div>
          <button class="nb-btn" style="height:36px;background:var(--surface);border:1px solid var(--border);" onclick="switchTab('details')">Cancel</button>
          <button class="nb-btn primary" style="height:36px;" onclick="submitGRN()"><i class="ti ti-circle-check"></i> Submit GRN</button>
        </div>
        <div style="padding:var(--space-md) var(--space-xl) var(--space-xl);border-top:1px solid var(--border);">
          <label style="font-size:12px;font-weight:600;color:var(--text-soft);display:block;margin-bottom:var(--space-xs);">Delivery note (optional)</label>
          <textarea id="grn-note-field" style="width:100%;height:60px;padding:var(--space-sm) var(--space-md);border:1px solid var(--border);border-radius:var(--radius-md);font-family:inherit;font-size:13px;color:var(--text);resize:none;background:var(--surface);" placeholder="e.g. 2 trays short on Short Rib. Driver noted backorder — to follow Thursday."></textarea>
        </div>`;
      }
      const card = mkCard('<i class="ti ti-clipboard-check"></i> Goods received note', headBadge, inner);
      el.appendChild(card);
    }

    function grnCheck(i, ordQty) {
      const q = document.getElementById('grn-q-'+i);
      const row = document.getElementById('grn-r-'+i);
      if (q && row) row.style.background = parseFloat(q.value) < ordQty ? 'rgba(238,75,135,0.05)' : '';
      // update summary
      let sh=0, dm=0;
      _currentPO.items.forEach((_,j) => {
        const qe = document.getElementById('grn-q-'+j);
        const de = document.getElementById('grn-d-'+j);
        if (qe && parseFloat(qe.value) < _currentPO.items[j].qty) sh++;
        if (de && de.checked) dm++;
      });
      const gs = document.getElementById('gs-short');
      const gd = document.getElementById('gs-dmg');
      if (gs) gs.textContent = sh;
      if (gd) gd.textContent = dm;
    }
    function submitGRN() {
      let hasDisc = false;
      _currentPO.items.forEach((_,j) => {
        const q = document.getElementById('grn-q-'+j);
        const d = document.getElementById('grn-d-'+j);
        if ((q && parseFloat(q.value) < _currentPO.items[j].qty) || (d && d.checked)) hasDisc = true;
      });
      toast(hasDisc ? 'GRN submitted with discrepancy — invoice held for review' : 'GRN submitted · order received');
      setTimeout(() => location.href = 'orders.html', 2300);
    }

    /* Comms tab */
    function renderComms(po, el) {
      let inner = '';
      (po.comms||[]).forEach(msg => {
        const isOut = msg.dir==='out';
        inner += `<div class="comms-msg" style="margin:var(--space-md) var(--space-xl);">
          <div class="comms-msg-head" style="background:${isOut?'var(--surface-soft)':'var(--mint)'};">
            <div><div class="comms-msg-from"><i class="ti ${isOut?'ti-send':'ti-inbox'}" style="font-size:11px;margin-right:3px;${isOut?'':'color:var(--spinach);'}"></i>${msg.from}</div></div>
            <span class="comms-msg-time">${msg.time}</span>
          </div>
          <div class="comms-msg-body">${msg.body}</div>
          ${msg.attach ? `<button class="comms-attach" onclick="toast('Downloading ${msg.attach}…')"><i class="ti ti-paperclip"></i> ${msg.attach}</button>` : ''}
        </div>`;
      });
      inner += `<div class="comms-reply">
        <textarea id="comms-reply-txt" placeholder="Reply to ${po.supplier}…"></textarea>
        <button class="nb-btn primary" style="height:40px;align-self:flex-end;padding-inline:var(--space-md);" onclick="sendReply()"><i class="ti ti-send"></i></button>
      </div>`;
      el.appendChild(mkCard(`<i class="ti ti-messages"></i> Supplier communications`,
        `<span style="font-size:12px;color:var(--text-soft);">${po.comms?.length||0} message${po.comms?.length!==1?'s':''}</span>`,
        inner));
    }

    /* Invoice tab */
    function renderInvoice(po, el) {
      const invStatus = po.invoice?.status || 'missing';

      if (invStatus === 'missing') {
        const card = mkCard('<i class="ti ti-receipt"></i> Invoice',
          '<span class="nb-pill warn" style="font-size:11px;"><i class="ti ti-alert-circle"></i>Not uploaded</span>',
          `<div style="padding:var(--space-xl);">
            <div class="invoice-upload-zone" id="inv-upload-zone" onclick="simulateInvUpload(this, '${po.id}')">
              <i class="ti ti-cloud-upload" style="font-size:36px;display:block;margin-bottom:var(--space-sm);"></i>
              <div style="font-weight:700;margin-bottom:6px;color:var(--text);">Upload paper invoice</div>
              <div style="font-size:12px;">Take a photo or attach a file &middot; PDF, JPG, PNG</div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:var(--space-md);">
              <div style="font-size:12px;color:var(--text-soft);display:flex;align-items:center;gap:6px;"><i class="ti ti-sparkles spark"></i>Cyrus will auto-match once uploaded</div>
              <button class="nb-btn" style="height:34px;padding-inline:var(--space-md);border:1px solid var(--border);border-radius:var(--radius-md);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--text-soft);" onclick="toast('Invoice marked as pending · Upload from this screen when you have it')"><i class="ti ti-clock"></i> Upload later</button>
            </div>
          </div>`);
        el.appendChild(card);
        return;
      }

      const inv = po.invoice;
      const isMatched = invStatus === 'matched';

      let thumbHtml = '';
      if (isMatched) {
        thumbHtml = `<div class="inv-thumb">
          <div class="inv-thumb-img"><i class="ti ti-file-invoice"></i></div>
          <div><div style="font-size:13px;font-weight:700;color:var(--text);">${inv.id}.pdf</div><div style="font-size:12px;color:var(--text-soft);margin-top:2px;">Uploaded by outlet · scanned paper invoice</div></div>
        </div>`;
      }

      const rows = [
        kv('Invoice ref', inv.id),
        kv('Invoice amount', inv.amount),
        kv('PO amount', '$'+po.value.toLocaleString()),
        kv('3-way match', isMatched
          ? '<span class="nb-pill ok" style="font-size:11px;"><i class="ti ti-circle-check"></i>Passed</span>'
          : '<span class="nb-pill risk" style="font-size:11px;"><i class="ti ti-alert-hexagon"></i>Failed — on hold</span>'),
        kv('Method', inv.method),
      ].join('');
      let extra = '';
      if (!isMatched) extra = `<div style="padding:var(--space-md) var(--space-xl) var(--space-lg);border-top:1px solid var(--border);display:flex;gap:var(--space-sm);">
        <button class="nb-btn primary" style="height:38px;" onclick="toast('Raising credit note…')"><i class="ti ti-receipt-refund"></i> Raise credit note</button>
        <button class="nb-btn" style="height:38px;background:var(--surface);border:1px solid var(--border);" onclick="switchTab('comms')"><i class="ti ti-message-circle"></i> Reply to supplier</button>
      </div>`;
      const card = mkCard('<i class="ti ti-receipt"></i> Invoice match',
        '<div class="agent-byline-sm"><i class="ti ti-sparkles spark"></i> Cyrus</div>',
        `${thumbHtml}<div style="padding:0 var(--space-xl) var(--space-sm);"><div class="kv-list">${rows}</div></div>${extra}`);
      card.classList.add('agent-surface');
      el.appendChild(card);
    }

    function simulateInvUpload(zone) {
      zone.onclick = null;
      zone.innerHTML = `<i class="ti ti-loader-2 ti-spin" style="font-size:28px;display:block;margin-bottom:var(--space-sm);"></i><div style="font-weight:700;color:var(--text);margin-bottom:4px;">Uploading…</div><div style="font-size:12px;">Cyrus is extracting invoice details</div>`;
      setTimeout(() => {
        toast('Invoice uploaded · Cyrus matched 3 of 3 lines · match passed');
        const head = zone.closest('.detail-card')?.querySelector('.card-head');
        if (head) {
          const pill = head.querySelector('.nb-pill');
          if (pill) { pill.className = 'nb-pill ok'; pill.innerHTML = '<i class="ti ti-circle-check"></i>Matched'; }
        }
        zone.innerHTML = `<div class="inv-thumb-img" style="margin:0 auto var(--space-md);"><i class="ti ti-file-invoice"></i></div><div style="font-weight:700;color:var(--text);margin-bottom:4px;">Invoice matched</div><div style="font-size:12px;">Cyrus performed 3-way match · all lines passed</div>`;
        zone.style.cursor = 'default';
        zone.style.borderColor = 'var(--status-ok-fg)';
        zone.style.color = 'var(--status-ok-fg)';
      }, 1800);
    }

    /* ── DOM helpers ── */
    function mkCard(titleHtml, rightHtml, bodyHtml) {
      const d = document.createElement('div');
      d.className = 'detail-card';
      d.innerHTML = `<div class="card-head"><span class="card-head-title">${titleHtml}</span>${rightHtml}</div>${bodyHtml}`;
      return d;
    }
    function kv(label, value) {
      return `<div class="kv-row"><span class="kv-label">${label}</span><span class="kv-value">${value}</span></div>`;
    }

    /* ── Sidebar ── */
    function renderOrderMeta(po) {
      const approvalBadge = po.approval==='manager'
        ? '<span style="color:var(--status-warn-fg);font-weight:700;">Manager required</span>'
        : '<span style="color:var(--status-ok-fg);font-weight:700;">Auto-approved</span>';
      document.getElementById('order-meta-kv').innerHTML = [
        kv('Raised by', po.createdBy),
        kv('Created', po.created),
        kv('Type', 'Purchase Order'),
        kv('Approval', approvalBadge),
      ].join('');
    }
    function renderSupplier(po) {
      const sc = SUP_COLORS[po.supplier] || { bg:'var(--surface-soft)', fg:'var(--text-soft)' };
      const [cn] = (SUP_CONTACTS[po.supplier]||'—').split(' · ');
      document.getElementById('supplier-card-body').innerHTML = `
        <div style="display:flex;align-items:center;gap:var(--space-md);margin-bottom:var(--space-md);">
          <div class="sup-avatar" style="background:${sc.bg};color:${sc.fg};">${supInits(po.supplier)}</div>
          <div><div style="font-size:15px;font-weight:700;color:var(--text);">${po.supplier}</div><div style="font-size:12px;color:var(--text-soft);">Verified supplier</div></div>
        </div>
        <div class="kv-list">
          ${kv('Schedule', `<span style="font-size:12px;">${SUP_SCHEDULES[po.supplier]||'—'}</span>`)}
          ${kv('Contact', `<span style="font-size:12px;">${cn||'—'}</span>`)}
          ${kv('Nomni Supply', '<span style="color:var(--status-ok-fg);"><i class="ti ti-circle-check"></i> Connected</span>')}
        </div>`;
    }
    function renderActivity(po) {
      document.getElementById('activity-feed').innerHTML = [...po.activity].reverse().map(a =>
        `<div class="act-item">
          <div class="act-dot ${a.tone}"><i class="ti ${a.icon}" style="font-size:10px;"></i></div>
          <div class="act-body"><div class="act-text">${a.text}</div><div class="act-time">${a.time}</div></div>
        </div>`
      ).join('');
    }

    /* ── Actions ── */
    function approveOrder() {
      document.getElementById('action-banner').innerHTML = `<div class="action-banner ok" style="margin-bottom:var(--space-lg);">
        <div class="banner-icon ok"><i class="ti ti-circle-check"></i></div>
        <div class="banner-body"><div class="banner-title">Approved — sending to supplier</div><div class="banner-sub">PO is being dispatched now.</div></div>
      </div>`;
      toast('Approved and sent to ' + _currentPO.supplier);
      setTimeout(() => location.href = 'orders.html', 2200);
    }
    function openReject()  { document.getElementById('reject-modal').style.display = ''; }
    function closeReject() { document.getElementById('reject-modal').style.display = 'none'; }
    function confirmReject() {
      closeReject();
      toast('Order rejected — returned to ' + (_currentPO.createdBy||'requester'));
      setTimeout(() => location.href = 'orders.html', 2200);
    }
    function sendChase() {
      const btn = document.getElementById('chase-btn');
      if (btn) { btn.innerHTML = '<i class="ti ti-clock"></i> Sent'; btn.disabled = true; }
      toast('Chase email sent to ' + _currentPO.supplier);
      _currentPO.comms.push({ dir:'out', from:'You', time:'Just now',
        body:'Hi,\n\nFollowing up on '+_currentPO.id+' — expected '+_currentPO.expected+' and hasn\'t arrived. Please provide an updated ETA.\n\nThanks' });
      _currentPO.activity.push({ tone:'info', icon:'ti-mail-forward', text:'Chase email sent to <strong>'+_currentPO.supplier+'</strong>', time:'Just now' });
      renderActivity(_currentPO);
    }
    function sendReply() {
      const txt = document.getElementById('comms-reply-txt');
      if (!txt || !txt.value.trim()) return;
      _currentPO.comms.push({ dir:'out', from:'You', time:'Just now', body:txt.value });
      txt.value = '';
      renderMain(_currentPO);
      toast('Reply sent to ' + _currentPO.supplier);
    }
    let _photoItem = '', _photoIdx = -1;
    const _linePhotos = {};
    function openPhoto(name, idx) { _photoItem = name; _photoIdx = idx; document.getElementById('photo-modal-item').textContent = name; document.getElementById('photo-modal').style.display = ''; }
    function closePhoto() { document.getElementById('photo-modal').style.display = 'none'; }
    function photoUploaded() {
      _linePhotos[_photoItem] = (_linePhotos[_photoItem] || 0) + 1;
      closePhoto();
      toast('Photo attached for ' + _photoItem);
      const btn = document.getElementById('grn-photo-'+_photoIdx);
      if (btn) {
        btn.outerHTML = `<span class="photo-badge" id="grn-photo-${_photoIdx}"><i class="ti ti-camera"></i> ${_linePhotos[_photoItem]} photo</span>`;
      }
    }

    /* ── Toast ── */
    function toast(msg) {
      const wrap = document.getElementById('toast-wrap');
      const t = document.createElement('div');
      t.style.cssText = 'display:flex;align-items:center;gap:8px;background:var(--surface-deep);color:var(--cream);padding:12px 18px;border-radius:var(--radius-md);box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;pointer-events:auto;';
      t.innerHTML = '<i class="ti ti-circle-check" style="color:var(--spring);font-size:16px;"></i>' + msg;
      wrap.appendChild(t);
      setTimeout(() => t.remove(), 2800);
    }

    /* ── Init ── */
    (function() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id') || 'PO-5521';
      const po = PO_DATA[id] || PO_DATA['PO-5521'];
      _currentPO = po;
      // Default tab: honour ?tab= param, else GRN for delivered/delayed, else details
      _tab = params.get('tab') || ((po.status==='delivered'||po.status==='delayed') ? 'grn' : 'details');

      document.title = po.id + ' — Nomni Procure';
      document.getElementById('bc-id').textContent = po.id;
      document.getElementById('order-id').textContent = po.id;
      document.getElementById('status-pill').innerHTML = STATUS_PILL[po.status]||'';
      document.getElementById('meta-supplier').textContent = po.supplier;
      document.getElementById('meta-outlet').textContent = po.outlet;
      document.getElementById('meta-value').textContent = '$' + po.value.toLocaleString();
      document.getElementById('meta-expected').innerHTML = po.status==='delayed'
        ? `<span style="color:var(--status-risk-fg);font-weight:600;">Expected ${po.expected} · overdue</span>`
        : `Expected ${po.expected}`;
      document.getElementById('head-actions').innerHTML = `
        <button class="nb-btn" style="height:40px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding-inline:var(--space-lg);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:var(--space-xs);" onclick="toast('Downloading PO PDF…')"><i class="ti ti-download"></i> Export PDF</button>
        <button class="nb-btn" style="height:40px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding-inline:var(--space-lg);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:var(--space-xs);" onclick="toast('Resending PO email…')"><i class="ti ti-mail-forward"></i> Resend PO</button>`;

      renderLifecycle(po);
      renderActionBanner(po);
      renderTabs(po);
      renderMain(po);
      renderOrderMeta(po);
      renderSupplier(po);
      renderActivity(po);
    })();
  </script>
</body>
</html>
